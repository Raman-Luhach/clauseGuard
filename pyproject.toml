[project]
name = "clauseguard"
version = "0.1.0"
description = "Flags risky clauses in terms of service, privacy policies and contracts, and explains them in plain language."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "pdfplumber>=0.11",
    "langdetect>=1.0.9",
    "certifi",
]

[dependency-groups]
# Fine-tuning and ONNX export (the GPU session, and exporting on the Mac afterwards)
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "onnx>=1.17",
    "onnxscript>=0.2",
]
# Serving: API + web UI + ONNX inference. Deliberately no torch, so the deployed image is small.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
# Optional plain-language explanations from Claude
llm = [
    "anthropic>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
clauseguard = "clauseguard.cli:main"

[tool.uv]
default-groups = ["dev", "train", "serve", "llm"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauseguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: downloads a small model or reads the real datasets",
]
filterwarnings = [
    "ignore::DeprecationWarning:spacy.*",
    # synthetic test data uses only some of a module's labels
    "ignore:Label not .* is present in all training examples:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
